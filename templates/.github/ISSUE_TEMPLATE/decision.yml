name: Decision
description: Propose a choice that affects more than one member (lightweight ADR).
title: "[Decision] "
labels: ["kind:decision", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Lazy consensus: the proposal is accepted if no member objects (thumbs-down or a comment) within the decision window (default 24 hours).
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem forces a decision now?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Two or three realistic options with trade-offs.
      placeholder: |
        1. Option A - pros / cons
        2. Option B - pros / cons
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which option, and why.
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline (optional)
      description: Needed by when, if earlier than the default window.
